<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="780" viewBox="0 0 2000 780" role="img" aria-labelledby="title desc">
<title id="title">B300 GPU and NUMA topology</title>
<desc id="desc">Two CPU sockets, each with 2006 GiB of DRAM and four B300 GPUs with 275 GB each. A bidirectional UPI link joins the sockets. Each GPU has a PCIe x16 host connection labeled CUDA approximately 57 GB/s and theoretical reference 64 GB/s per direction. The theoretical reference is PCIe Gen5 x16; the negotiated host link generation is not specified. Eight GPU branches join a shared connection labeled NVLink.</desc>
<defs>
  <marker id="pcie-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#58645b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="upi-arrow" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 3 3 L 11 7 L 3 11" fill="none" stroke="#66843b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="nvlink-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#b86e36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
